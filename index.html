      @font-face {

      html { background: #030210; }
      #boot {
        position: fixed; inset: 0; z-index: 99;
        display: flex; align-items: center; justify-content: center;
        background:

      }
      #boot.off { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-ring {
        width: 72px; height: 72px; border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, .2);
        border-top-color: #22d3ee; border-left-color: #8b5cf6;
        animation: bootspin 1s linear infinite;
        box-shadow: 0 0 40px rgba(124, 58, 237, .35), inset 0 0 20px rgba(34, 211, 238, .15);
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }

یا شبکهٔ کاربر نیستیم.</p><p>قطع شدن یک کانفیگ، کندی اینترنت محلی، یا مسدود شدن مسیر، به‌تنهایی به‌معنای تخلف سایت از این محدوده نیست.</p>"},{id:"nosignup",section:"آشنایی",title:"چرا ثبت‌نام نداریم",body:"<p>ورود به فهرست با کد ورود است، نه با ساخت حساب. این انتخاب برای کاهش پیچیدگی و کاهش ردپای حساب کاربری است.</p><p>کد ورود از کانال اطلاع‌رسانی در اختیار قرار می‌گیرد. سایت کد ورود نمی‌سازد و از طریق پشتیبانی نیز کد ورود جدید صادر نمی‌کند.</p>"},{id:"use",section:"مقررات",title:"قوانین استفاده کاربر",body:"<p>با استفاده از سایت، این موارد را می‌پذیرید:</p><p>استفاده شخصی و غیرمخرب. فروش مجدد یا انتشار عمومی لینک کانفیگ مجاز نیست.</p><p>مسئولیت نصب کلاینت (از جمله v2rayNG یا Hiddify)، صحت اتصال، و رعایت قوانین محل اقامت با کاربر است.</p><p>اهانت در گفتگو، تلاش برای اختلال در سایت یا دور زدن دروازهٔ ورود ممنوع است.</p><p>کانفیگ را در ابزارهای مشکوک وارد نکنید. لینک را در گروه عمومی نفرستید.</p>"},{id:"site",section:"مقررات",title:"قوانین سایت",body:"<p>ادارهٔ فهرست، دسته‌ها، اعلان‌ها و کد ورود با مدیر سایت است و ممکن است بدون اطلاع قبلی تغییر کند.</p><p>لینک کانفیگ به‌صورت متن قابل‌خواندن روی کارت نشان داده نمی‌شود. کپی و QR تنها روش تحویل روی صفحهٔ عمومی است.</p><p>خاموش شدن یک سرور، حذف دسته، یا تغییر «پیشنهادی امروز» حق مدیر است و به‌معنای تعهد به یک آدرس همیشگی نیست.</p><p>سوءاستفاده ممکن است به بستن دسترسی از طریق تغییر کد ورود یا قطع خدمت منجر شود.</p>"},{id:"terms",section:"مقررات",title:"شرایط و ضوابط",body:"<p>استفاده از FILTERNET به‌معنای اطلاع از اسناد منوی سایت و پذیرش آن‌هاست. اگر نمی‌پذیرید، از سایت استفاده نکنید.</p><p>متن‌های مقررات ممکن است به‌روز شوند. نسخهٔ معتبر، همان است که در همین سایت در لحظهٔ مراجعه دیده می‌شود.</p><p>در صورت تعارض با قوانین لازم‌الاجرای جمهوری اسلامی ایران، آن قوانین مقدم است.</p>"},{id:"privacy",section:"حریم و پایداری",title:"حریم خصوصی",body:"<p>حساب کاربری عمومی نداریم. آنچه برای کار سایت لازم است، عمدتاً روی همین مرورگر می‌ماند؛ از جمله توکن دروازه.</p><p>گفتگوی پشتیبانی برای پاسخ‌گویی نگهداری می‌شود.</p><p>داده را برای تبلیغات ثالث نمی‌فروشیم. از هوش مصنوعی برای پاسخ گفتگوی عمومی استفاده می‌شود؛ در گفتگو لینک کانفیگ و رمز نفرستید.</p><p>برای حذف دادهٔ محلی، داده‌های سایت را از مرورگر پاک کنید.</p>"},{id:"cookies",section:"حریم و پایداری",title:"کوکی و کد ورود",body:"<p>پس از ورود موفق، یک نشان به‌خاطر سپرده می‌شود تا تا وقتی مدیر کد را عوض نکرده، دوباره کد نپرسد. این نشان برای تبلیغات نیست.</p><p>اگر مدیر کد ورود را تغییر دهد، نشان قبلی از اعتبار می‌افتد و باید کد جدید را بزنید. بنر هشدار در همان حالت نمایش داده می‌شود.</p><p>می‌توانید کوکی و ذخیره‌سازی محلی مرورگر را پاک کنید؛ در آن صورت دروازه دوباره ظاهر می‌شود.</p>"},{id:"availability",section:"حریم و پایداری",title:"در دسترس بودن سرویس",body:"<p>سایت و کانفیگ‌ها با «بهترین تلاش» ارائه می‌شوند و سطح خدمت تضمینی (SLA) اعلام نمی‌کنیم.</p><p>قطعی برق و شبکه، فیلتر مسیر، تعمیرات، یا از کار افتادن یک سرور ممکن است رخ دهد. در صورت امکان، اعلان بالای صفحه گذاشته می‌شود.</p><p>در دسترس نبودن موقت به‌تنهایی ایجاد حق خسارت نمی‌کند. کانفیگ عمومی ممکن است هر زمان عوض یا خاموش شود.</p>"}];function FE(a){const i=l=>l.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");return String(a||"").split(/\n{2,}/).map(l=>"<p>"+i(l).replace(/\n/g,"<br>")+"</p>").join("")}function $E(a,i){return a.map(l=>{const r=to(l.tags),u=String(l.category||"").trim();return(i[u]||[]).forEach(f=>{r.includes(f)||r.push(f)}),{...l,tags:r}})}function IE(){const[a,i]=R.useState(null),[l,r]=R.useState(!1),[u,f]=R.useState([]),[d,m]=R.useState({}),[y,g]=R.useState(!0),[x,v]=R.useState(!1),[S,E]=R.useState(""),[A,w]=R.useState(""),[L,B]=R.useState([]),[C,D]=R.useState(JE),[k,st]=R.useState(null),[P,z]=R.useState(!1),[H,Q]=R.useState(null),[I,tt]=R.useState([]),at=R.useRef(!1),J=R.useRef(!1);J.current=!!k;const W=R.useCallback((K,et=!0)=>{const ut=Date.now()+Math.random();tt(ct=>[...ct.slice(-2),{id:ut,msg:K,ok:et}]),setTimeout(()=>tt(ct=>ct.filter(Ct=>Ct.id!==ut)),2600)},[]),ht=R.useCallback(async()=>{const K=await de.servers();if(K&&K.
