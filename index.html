<style>
  :root{
    --bg:#0e1014;
    --surface:#15181e;
    --surface2:#1c2027;
    --border:#262b34;
    --text:#e8eaee;
    --muted:#98a2b3;
    --accent:#3b82f6;
    --accent-hover:#2f6fe0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; line-height:1.7;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}

  /* هدر */
  header{
    position:sticky; top:0; z-index:10;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0}
  .brand{display:flex; align-items:center; gap:12px}
  .logo-img{width:42px; height:42px; border-radius:4px; flex:0 0 auto; border:1px solid var(--border)}
  .brand h1{font-size:20px; font-weight:800; letter-spacing:.5px}
  .brand p{font-size:12px; color:var(--muted); margin-top:-2px}
  .count-pill{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:4px;
    background:var(--surface); border:1px solid var(--border); font-size:13px; color:var(--muted);
  }
  .count-pill b{color:var(--accent); font-size:16px}

  /* هیرو */
  .hero{text-align:center; padding:48px 0 34px}
  .hero .hero-logo{width:84px; height:84px; border-radius:6px; margin-bottom:18px; border:1px solid var(--border)}
  .hero h2{font-size:clamp(24px,4vw,34px); font-weight:800; margin-bottom:10px}
  .hero p{color:var(--muted); max-width:560px; margin:0 auto; font-size:15px}

  .cats{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0 6px}
  .cat-btn{
    padding:7px 14px; border-radius:4px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:700; transition:.15s;
  }
  .cat-btn:hover{border-color:#3a4150; color:var(--text)}
  .cat-btn.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .cat-copy-bar{margin:14px auto 0; max-width:420px; text-align:center}
  .cat-copy-bar .btn{width:100%}
  .cat-copy-bar p{color:var(--muted); font-size:12px; margin-top:8px}

  /* گرید سرورها */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; padding:8px 0 56px}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.35); transition:.18s; display:flex; flex-direction:column; gap:12px;
  }
  .card:hover{transform:translateY(-2px); border-color:#343b47; box-shadow:0 10px 24px rgba(0,0,0,.45)}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .flag{font-size:28px; line-height:1.2}
  .badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:3px; letter-spacing:.3px}
  .feat{font-size:11px; font-weight:800; padding:3px 8px; border:1px solid var(--border); border-radius:3px; color:var(--text); background:var(--surface2); margin-left:6px}
  .card-top-badges{display:flex; flex-direction:column; align-items:flex-end; gap:6px}
  .card h3{font-size:16px; margin-top:2px}
  .card .loc{font-size:12.5px; color:var(--muted)}
  .card-actions{display:flex; gap:10px}
  .btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 14px; border-radius:4px; border:1px solid transparent; cursor:pointer; font-family:inherit;
    font-size:13.5px; font-weight:700; transition:.15s;
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent); color:#fff}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-ghost{background:transparent; border-color:var(--border); color:var(--text)}
  .btn-ghost:hover{border-color:#3a4150; background:var(--surface2)}

  .empty{
    grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--muted);
    background:var(--surface); border:1px dashed #2c313a; border-radius:4px;
  }
  .empty .big{font-size:38px; margin-bottom:10px}

  footer{border-top:1px solid var(--border); padding:22px 0; text-align:center; color:var(--muted); font-size:12.5px; background:var(--surface)}

  /* توست */
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1b1f27; border:1px solid var(--border); color:var(--text);
    padding:12px 22px; border-radius:4px; font-size:14px; z-index:50; opacity:0;
    transition:.25s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* مودال QR */
  #modal{
    position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.65); padding:20px;
  }
  #modal.open{display:flex}
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:26px;
    width:100%; max-width:380px; text-align:center; animation:pop .2s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-card h3{margin-bottom:4px; font-size:17px}
  .modal-card .loc{color:var(--muted); font-size:13px; margin-bottom:16px}
  #qrBox{background:#fff; border-radius:4px; padding:12px; display:inline-block; margin-bottom:16px}
  #qrBox svg{display:block; width:200px; height:200px}
  .modal-actions{display:flex; gap:10px; margin-top:8px}
  .btn-close{flex:1; background:transparent; border:1px solid var(--border); color:var(--text)}
  .btn-close:hover{border-color:#7f1d1d; color:#fca5a5}
</style>
</head>

<script>
(function () {
  var PROTO = {
    vless:    { label: 'VLESS',       c: '#67e8f9', bg: 'rgba(34,211,238,.14)' },
    vmess:    { label: 'VMess',       c: '#fcd34d', bg: 'rgba(245,158,11,.16)' },
    trojan:   { label: 'Trojan',      c: '#f9a8d4', bg: 'rgba(244,114,182,.15)' },
    ss:       { label: 'Shadowsocks', c: '#6ee7b7', bg: 'rgba(52,211,153,.15)' },
    ssr:      { label: 'SSR',         c: '#c4b5fd', bg: 'rgba(167,139,250,.16)' },
    hysteria2:{ label: 'Hysteria2',   c: '#fda4af', bg: 'rgba(251,113,133,.15)' },
    tuic:     { label: 'TUIC',        c: '#93c5fd', bg: 'rgba(96,165,250,.16)' }
  };

  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var toastEl = document.getElementById('toast');
  var modal = document.getElementById('modal');
  var currentLink = '';
  var activeCat = '';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function flagEmoji(code) {
    if (!code) return '🌐';
    code = String(code).trim().toUpperCase();
    if (/^[A-Z]{2}$/.test(code)) {
      return String.fromCodePoint.apply(null, code.split('').map(function (c) { return 127397 + c.charCodeAt(0); }));
    }
    return String(code);
  }

  function badge(p) {
    var m = PROTO[p] || { label: String(p || '؟').toUpperCase(), c: '#cbd5e1', bg: 'rgba(148,163,184,.14)' };
    return '<span class="badge" style="color:' + m.c + ';background:' + m.bg + '">' + m.label + '</span>';
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return legacyCopy(t); });
    }
    return Promise.resolve(legacyCopy(t));
  }
  function legacyCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  }

  function catsOf(list) {
    var seen = {}, out = [];
    list.forEach(function (s) {
      var c = String(s.category || '').trim();
      if (c && !seen[c]) { seen[c] = 1; out.push(c); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'fa'); });
    return out;
  }
  function linksOfCat(cat) {
    return servers.filter(function (s) {
      if (!cat) return true;
      return String(s.category || '').trim() === cat;
    }).map(function (s) { return String(s.link || '').trim(); }).filter(Boolean);
  }
  function copyCategory(cat) {
    if (!cat) { toast('برای کپی، یک دسته را انتخاب کن'); return; }
    var links = linksOfCat(cat);
    if (!links.length) { toast('این دسته کانفیگی ندارد'); return; }
    var n = links.length.toLocaleString('fa-IR');
    var label = cat ? 'دسته «' + cat + '»' : 'همه دسته‌ها';
    copyText(links.join('\n')).then(function (ok) {
      toast(ok ? '✅ ' + n + ' کانفیگ ' + label + ' کپی شد — تو v2rayNG از کلیپ‌بورد وارد کن' : '❌ کپی نشد');
    });
  }
  function renderCats() {
    var box = document.getElementById('cats');
    var bar = document.getElementById('catCopyBar');
    var cats = catsOf(servers);
    if (!cats.length) { box.innerHTML = ''; bar.innerHTML = ''; return; }
    if (activeCat && cats.indexOf(activeCat) < 0) activeCat = '';
    var html = '<button type="button" class="cat-btn' + (activeCat ? '' : ' on') + '" data-cat="">همه</button>';
    cats.forEach(function (c) {
      html += '<button type="button" class="cat-btn' + (activeCat === c ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    });
    box.innerHTML = html;
    if (activeCat) {
      var n = linksOfCat(activeCat).length.toLocaleString('fa-IR');
      bar.innerHTML = '<button type="button" class="btn btn-primary" data-copy-cat="' + esc(activeCat) + '">📋 کپی همه کانفیگ‌های «' + esc(activeCat) + '» (' + n + ')</button>' +
        '<p>تو v2rayNG یا Hiddify بزن: افزودن ← وارد کردن از کلیپ‌بورد</p>';
    } else {
      bar.innerHTML = '';
    }
  }
  function render() {
    renderCats();
    var list = servers;
    if (activeCat) list = servers.filter(function (s) { return String(s.category || '').trim() === activeCat; });
    if (!servers.length) {
      grid.innerHTML = '<div class="empty"><div class="big">🛰️</div>هنوز سروری اضافه نشده.</div>';
      countEl.textContent = '۰';
      return;
    }
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><div class="big">📂</div>در این دسته سروری نیست.</div>';
      countEl.textContent = '۰';
      return;
    }
    countEl.textContent = list.length.toLocaleString('fa-IR');
    grid.innerHTML = list.map(function (s) {
      var loc = s.country && /^[A-Z]{2}$/i.test(s.country) ? flagEmoji(s.country) + ' ' + s.country.toUpperCase() : (s.country || '');
      var cat = String(s.category || '').trim();
      return '' +
      '<div class="card">' +
        '<div class="card-top">' +
          '<div><div class="flag">' + flagEmoji(s.country) + '</div>' +
          '<h3>' + esc(s.name) + '</h3>' +
          '<div class="loc">' + esc(loc) + (cat ? ' · ' + esc(cat) : '') + '</div></div>' +
          '<div class="card-top-badges">' + (s.featured ? '<span class="feat">پیشنهادی</span>' : '') + badge(s.protocol) + '</div>' +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="btn btn-primary" data-copy="' + esc(s.link) + '">📋 کپی کانفیگ</button>' +
          '<button class="btn btn-ghost" data-qr="' + esc(s.link) + '" data-name="' + esc(s.name) + '" data-loc="' + esc(loc) + '">▦ QR</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function openQR(link, name, loc) {
    currentLink = link;
    document.getElementById('qrName').textContent = name;
    document.getElementById('qrLoc').textContent = loc || '';
    var box = document.getElementById('qrBox');
    try {
      var qr = qrcode(0, 'M');
      qr.addData(link);
      qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
    } catch (e) {
      box.innerHTML = '<div style="color:#111;padding:20px">خطا در ساخت QR</div>';
    }
    modal.classList.add('open');
  }

  var servers = [];
  function load() {
    fetch('/api/servers')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) { servers = d.servers || []; render(); }
        else throw new Error(d && d.error);
      })
      .catch(function () {
        grid.innerHTML = '<div class="empty"><div class="big">🔌</div>اتصال به سرور برقرار نشد.<br>اگر این صفحه را به‌صورت فایل باز کرده‌اید، از طریق آدرس سایت وارد شوید.</div>';
        countEl.textContent = '–';
      });
  }

  // رویدادها
  document.addEventListener('click', function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      copyText(cp.getAttribute('data-copy')).then(function (ok) {
        toast(ok ? '✅ کپی شد' : '❌ کپی نشد');
      });
      return;
    }
    var copyCat = e.target.closest('[data-copy-cat]');
    if (copyCat) {
      copyCategory(copyCat.getAttribute('data-copy-cat') || '');
      return;
    }
    var cat = e.target.closest('[data-cat]');
    if (cat) {
      activeCat = cat.getAttribute('data-cat') || '';
      render();
      return;
    }
    var qr = e.target.closest('[data-qr]');
    if (qr) {
      openQR(qr.getAttribute('data-qr'), qr.getAttribute('data-name'), qr.getAttribute('data-loc'));
    }
  });

  document.getElementById('qrCopy').addEventListener('click', function () {
    copyText(currentLink).then(function (ok) { toast(ok ? '✅ کپی شد' : '❌ کپی نشد'); });
  });
  document.getElementById('qrClose').addEventListener('click', function () { modal.classList.remove('open'); });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') modal.classList.remove('open'); });

  load();

  // به‌روزرسانی خودکار هر ۳۰ ثانیه — سرورهای جدید بدون رفرش دستی نمایش داده می‌شن
  setInterval(function () {
    if (!modal.classList.contains('open')) load();
  }, 30000);
})();
</script>
</body>
</html>
